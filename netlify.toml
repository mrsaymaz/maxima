[build]
  command = "npm run verify"
  publish = "dist"

# One rule per asset folder, so no file matches two Cache-Control rules (Netlify would combine them).
[[headers]]
  for = "/assets/emoji/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/guide/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/menu/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/music/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/pictograms/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/portraits/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/sfx/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/voice/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Compressed creature models carry a content hash in their names (scripts/build-web-creatures.mjs).
[[headers]]
  for = "/assets/creatures-web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and its shell list must always be revalidated so new builds reach players.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offline-shell.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
