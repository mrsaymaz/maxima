<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163b32"><title>Hufflepuff · Movement Preview</title><link rel="icon" href="icon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#9eae8c;color:#f6edcf;font:14px -apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}canvas{display:block}header{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:25px;right:25px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}h1{font:30px Georgia,serif;margin:5px 0}small{letter-spacing:2px;font-size:9px;color:#fff0c5}header a{color:#fff4d5;font-size:12px;text-decoration:none;pointer-events:auto;background:#183f35c9;padding:10px 15px;border:1px solid #cdd8ab77;border-radius:10px}footer{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(340px,calc(100% - 40px));text-align:center}.controls{display:flex;gap:7px;background:#163b32e8;border:1px solid #d1d7ae77;border-radius:12px;padding:5px}button{flex:1;border:0;background:none;color:#ebdfbd;padding:12px;border-radius:8px;font:inherit;cursor:pointer}.forms{display:flex;gap:5px;margin-bottom:8px;background:#163b32db;border:1px solid #d1d7ae55;border-radius:12px;padding:4px}.forms button{font-size:11px;padding:12px 5px;min-height:42px}.forms button.on{background:#557664;color:#fff2cf}button[hidden]{display:none}button.on{background:#e8d2a2;color:#294535}p{font-size:11px;color:#fff4d3;text-shadow:0 2px 8px #204633}#message{position:fixed;left:20%;right:20%;top:35%;padding:25px;background:#153c32;border-radius:16px;line-height:1.5}#message.hidden{display:none}button,a{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button:focus-visible,a:focus-visible{outline:3px solid #fff1b4;outline-offset:3px}.forms{overflow-x:auto;scrollbar-width:thin}.forms button{flex:0 0 48px}</style></head><body><header><div><small id="form-label">MAXIMA · LEVEL 0</small><h1>Hufflepuff</h1></div><a href="./">Back to game ↗</a></header><footer><div class="forms" role="group" aria-label="Choose creature form"><button data-level="0" aria-pressed="true" class="on">Level 0</button><button data-level="1" aria-pressed="false">Level 1</button><button data-level="2" aria-pressed="false">Level 2</button><button data-level="3" aria-pressed="false">Level 3</button></div><div class="controls"><button id="walk" class="on" aria-pressed="true">Walk</button><button id="idle" aria-pressed="false">Idle</button><button id="jump" aria-pressed="false">Jump</button></div><div class="controls"><button id="strike" aria-pressed="false">Strike</button><button id="airstrike" aria-pressed="false">Air strike</button><button id="turnstrike" aria-pressed="false">Turn</button><button id="hit" aria-pressed="false">Recoil</button></div><div class="controls"><button id="cast" aria-pressed="false">Elemental cast</button></div><p>Drag to look around · Scroll to zoom</p></footer><div id="message">Loading your creature…</div><script type="module" src="partner-preview.js"></script></body></html>
